# Provides Node/npm on the runner — required because Salesforce CLI is installed globally via npm.
name: SF setup Node.js
description: Setup Node.js for Salesforce CLI install
inputs:
  node_version:
    required: false
    default: '24'

runs:
  using: composite
  steps:
    # Pin Node so CLI installs stay reproducible across GitHub runner image updates.
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
