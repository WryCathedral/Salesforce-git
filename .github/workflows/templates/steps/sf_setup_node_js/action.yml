# Mirrors Certinia templates/steps pattern — Node for global npm (SF CLI).
name: SF setup Node.js
description: Setup Node.js for Salesforce CLI install
inputs:
  node_version:
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}
