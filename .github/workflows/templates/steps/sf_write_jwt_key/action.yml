# Mirrors Certinia sf_dwonload_jwt_token — materialize JWT PEM for Connected App login.
name: SF write JWT key
description: Write JWT private key to workspace
inputs:
  jwt_key:
    required: true

runs:
  using: composite
  steps:
    - run: |
        if [ -z "$JWT_KEY" ]; then
          echo "JWT key is not set."
          exit 1
        fi
        printf '%s\n' "$JWT_KEY" > "$GITHUB_WORKSPACE/privatekey.key"
        chmod 600 "$GITHUB_WORKSPACE/privatekey.key"
      shell: bash
      env:
        JWT_KEY: ${{ inputs.jwt_key }}
