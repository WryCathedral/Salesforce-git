# Installs the Salesforce CLI (`sf`) at a specific version so plugins and scripts share one toolchain.
name: SF install CLI plugins
description: Install Salesforce CLI globally
inputs:
  sf_cli_version:
    required: true

runs:
  using: composite
  steps:
    - run: ./.github/workflows/templates/scripts/install_sf_cli.ps1 "${{ inputs.sf_cli_version }}"
      shell: pwsh
