# Mirrors Certinia sf_install_CLI_plugins — install @salesforce/cli + prerequisites via npm.
name: SF install CLI plugins
description: Install Salesforce CLI globally
inputs:
  sf_cli_version:
    required: true

runs:
  using: composite
  steps:
    - run: ./.github/workflows/templates/scripts/install_sf_cli.ps1 "${{ inputs.sf_cli_version }}"
      shell: pwsh
