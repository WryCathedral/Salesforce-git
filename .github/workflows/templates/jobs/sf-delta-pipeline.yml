#################################################################################################
# Single job: shared tooling + JWT + auth once; branch by inputs.run_validate / run_deploy.      #
# • PR path → Code Analyzer (optional) → validate_delta.ps1 → delta artifact                   #
# • Deploy path → deploy_delta.ps1 (checkout ref differs)                                       #
#################################################################################################
name: SF Delta · pipeline

on:
  workflow_call:
    inputs:
      run_validate:
        description: Run PR validation path
        type: boolean
        required: true
      run_deploy:
        description: Run deploy path
        type: boolean
        required: true
      github_environment:
        description: GitHub Environment
        type: string
        required: true
      environment_slug:
        description: Artifact / display slug (qa, uat, …)
        type: string
        required: true
      target_branch:
        description: Integration branch for dispatch deploy checkout
        type: string
        required: true

permissions:
  contents: read
  actions: write

jobs:
  sf-delta:
    name: ${{ inputs.run_validate && format('Validating ({0})', inputs.environment_slug) || format('Deploying ({0})', inputs.environment_slug) }}
    if: ${{ inputs.run_validate || inputs.run_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    environment: ${{ inputs.github_environment }}
    env:
      SYSTEM_PULLREQUEST_TARGETBRANCH: ${{ inputs.run_validate && format('refs/heads/{0}', github.base_ref) || '' }}
      BUILD_SOURCEBRANCH: ${{ inputs.run_validate && github.ref || (github.event_name == 'workflow_dispatch' && format('refs/heads/{0}', inputs.target_branch) || format('refs/heads/{0}', github.base_ref)) }}
      SF_CLI_VERSION: ${{ vars.SF_CLI_VERSION != '' && vars.SF_CLI_VERSION || '2.100.0' }}
      SF_RUN_CODE_ANALYZER: ${{ vars.SF_RUN_CODE_ANALYZER }}
      SF_JWT_PRIVATE_KEY: ${{ secrets.SF_JWT_PRIVATE_KEY }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_IS_DEV_HUB: ${{ secrets.SF_IS_DEV_HUB }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
      SF_ALIAS: ${{ secrets.SF_ALIAS }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ inputs.run_validate }}
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        if: ${{ inputs.run_deploy }}
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.event.pull_request.merge_commit_sha }}

      - uses: ./.github/workflows/templates/steps/sf_setup_node_js

      - uses: ./.github/workflows/templates/steps/sf_install_cli_plugins
        with:
          sf_cli_version: ${{ env.SF_CLI_VERSION }}

      - uses: ./.github/workflows/templates/steps/sf_install_git_delta_plugin

      - uses: ./.github/workflows/templates/steps/sf_write_jwt_key
        with:
          jwt_key: ${{ env.SF_JWT_PRIVATE_KEY }}

      - uses: ./.github/workflows/templates/steps/sf_install_code_analyzer
        if: ${{ inputs.run_validate && env.SF_RUN_CODE_ANALYZER != 'false' }}

      - uses: ./.github/workflows/templates/steps/sf_run_code_analyzer
        if: ${{ inputs.run_validate && env.SF_RUN_CODE_ANALYZER != 'false' }}

      - uses: ./.github/workflows/templates/steps/sf_upload_code_analyzer_artifact
        if: ${{ inputs.run_validate && env.SF_RUN_CODE_ANALYZER != 'false' }}
        with:
          artifact_name: sf-code-analyzer-${{ inputs.environment_slug }}

      - uses: ./.github/workflows/templates/steps/sf_authenticate_org
        with:
          username: ${{ env.SF_USERNAME }}
          is_dev_hub: ${{ env.SF_IS_DEV_HUB }}
          client_id: ${{ env.SF_CLIENT_ID }}
          instance_url: ${{ env.SF_INSTANCE_URL }}
          alias: ${{ env.SF_ALIAS }}

      - name: Validate delta package (dry-run)
        if: ${{ inputs.run_validate }}
        run: ./.github/workflows/templates/scripts/validate_delta.ps1 "$env:SF_ALIAS"
        shell: pwsh
        env:
          SF_ALIAS: ${{ env.SF_ALIAS }}

      - uses: ./.github/workflows/templates/steps/sf_upload_delta_artifact
        if: ${{ inputs.run_validate }}
        with:
          artifact_name: Delta-Package-${{ inputs.environment_slug }}

      - name: Deploy delta package
        if: ${{ inputs.run_deploy }}
        run: ./.github/workflows/templates/scripts/deploy_delta.ps1 "$env:SF_ALIAS"
        shell: pwsh
        env:
          SF_ALIAS: ${{ env.SF_ALIAS }}
